<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0A192F" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/icon-192.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
        Niente meta "description" o link "canonical" statici qui: ogni pagina
        React li renderizza per conto proprio (title/meta/link vengono
        "sollevati" nell'head automaticamente da React 19, senza bisogno di
        react-helmet-async, che non supporta React 19 e non aggiornava mai
        nulla). Tenerli anche qui creerebbe un duplicato "statico" che vince
        sempre su quello corretto della pagina, perché React non rimuove tag
        che non ha renderizzato lui stesso.
        -->
        <link rel="manifest" href="/manifest.json" />

        <!--
        Open Graph/Twitter: qui resta SOLO il nome del sito (davvero
        identico su ogni pagina) e il tipo di anteprima Twitter. NIENT'ALTRO
        di og:*/twitter:* — nemmeno og:type, che varia tra "website" e
        "article": React 19 aggiunge i propri tag per la pagina corrente ma
        non rimuove quelli statici già presenti qui (non li ha renderizzati
        lui, non ha modo di saperlo) — un valore statico qui finirebbe
        duplicato accanto a quello corretto, e query come
        document.querySelector('meta[property="og:type"]') troverebbero
        ancora il PRIMO (quello statico, sbagliato) invece del secondo.
        Questi tag per-pagina li genera PageMeta.jsx (client) o
        scripts/prerender.js (per i crawler che non eseguono JS).
        -->
        <meta property="og:site_name" content="SALESFLY" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        Cabinet Grotesk/Manrope/JetBrains Mono (Fontshare): prima erano
        un @import dentro src/index.css, invisibile al preload scanner del
        browser finché non aveva già scaricato E iniziato a parsare tutto
        il CSS principale — una catena di richieste in sequenza (HTML ->
        CSS principale -> scopre l'@import -> CSS Fontshare -> scopre i
        font veri) che da sola valeva ~1,8s di latenza sul percorso
        critico (verificato con PageSpeed Insights). Con un <link> qui, il
        browser la scopre subito dall'HTML grezzo, in parallelo al resto.
        -->
        <link rel="preconnect" href="https://api.fontshare.com" />
        <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
        <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@900,800,700,500,400&f[]=manrope@700,600,500,400&f[]=jetbrains-mono@500,400&display=swap" rel="stylesheet" />
        <!--
        NIENT'ALTRO preconnect qui, apposta: index.html è un unico shell
        condiviso da OGNI pagina della SPA, quindi ogni preconnect qui ha un
        costo su tutte le pagine anche quando l'origine non serve a quella
        pagina specifica. images.unsplash.com (usato solo da Login.jsx e
        BlogIndex.jsx) era stato aggiunto qui e PageSpeed Insights lo ha
        segnalato "non utilizzato" proprio sulla home — rimosso. Se in
        futuro serve un preconnect solo per /blog o /login, va aggiunto
        dinamicamente in quella pagina (es. via un <link> renderizzato da
        React in quel componente), non qui.
        -->
        <!--
        Google Analytics e PostHog NON vengono più caricati qui: partivano
        incondizionatamente ad ogni visita, prima ancora di qualunque scelta
        dell'utente. Ora vengono caricati da src/lib/analytics.js, solo dopo
        consenso esplicito (vedi CookieConsentContext/CookieConsentBanner).
        -->
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <title>SALESFLY — Il CRM per Agenti di Commercio Plurimandatari</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
