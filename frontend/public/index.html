<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0A192F" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/icon-192.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
        Niente meta "description" o link "canonical" statici qui: ogni pagina
        React li renderizza per conto proprio (title/meta/link vengono
        "sollevati" nell'head automaticamente da React 19, senza bisogno di
        react-helmet-async, che non supporta React 19 e non aggiornava mai
        nulla). Tenerli anche qui creerebbe un duplicato "statico" che vince
        sempre su quello corretto della pagina, perché React non rimuove tag
        che non ha renderizzato lui stesso.
        -->
        <link rel="manifest" href="/manifest.json" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="SALESFLY" />
        <meta property="og:title" content="SALESFLY — Il CRM per Agenti di Commercio Plurimandatari" />
        <meta property="og:description" content="L'unico CRM con un assistente che il lavoro non lo spiega: lo fa. Clienti, agenda, provvigioni e offerte per chi vive di visite e mandanti." />
        <meta property="og:url" content="https://salesfly.it/" />
        <meta property="og:locale" content="it_IT" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="SALESFLY — Il CRM per Agenti di Commercio Plurimandatari" />
        <meta name="twitter:description" content="L'unico CRM con un assistente che il lavoro non lo spiega: lo fa. Clienti, agenda, provvigioni e offerte per chi vive di visite e mandanti." />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        Google Analytics e PostHog NON vengono più caricati qui: partivano
        incondizionatamente ad ogni visita, prima ancora di qualunque scelta
        dell'utente. Ora vengono caricati da src/lib/analytics.js, solo dopo
        consenso esplicito (vedi CookieConsentContext/CookieConsentBanner).
        -->
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>SALESFLY — Il CRM per Agenti di Commercio Plurimandatari</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
