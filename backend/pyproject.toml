[project]
name = "salesfly-backend"
version = "0.1.0"
description = "Backend API per SALESFLY — CRM per agenti di commercio plurimandatari"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.0.1",
  "uvicorn==0.52.4",
  "boto3>=1.34.129",
  "requests-oauthlib>=2.0.0",
  "cryptography>=42.0.8",
  "python-dotenv>=1.0.1",
  "pymongo==4.6.3",
  "pydantic>=2.6.4",
  "email-validator>=2.2.0",
  "pyjwt>=2.10.1",
  "bcrypt==4.1.3",
  "passlib>=1.7.4",
  "tzdata>=2024.2",
  "motor==3.3.1",
  "requests>=2.31.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
  "jq>=1.6.0",
  "typer>=0.9.0",
  "anthropic>=0.40.0",
  "stripe>=7.0.0",
  "resend>=2.0.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-pymongo>=0.48b0",
  "opentelemetry-instrumentation-requests>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "black>=24.1.1",
  "isort>=5.13.2",
  "flake8>=7.0.0",
  "mypy>=1.8.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
# I test usano volutamente oggetti fake (FakeRequest/FakeResponse/...) al posto
# dei tipi reali di FastAPI/Starlette per isolarsi dal framework — un pattern
# di test deliberato, non un bug, che mypy non può verificare staticamente.
# pytest è già una rete di sicurezza molto più efficace per il codice dei test.
exclude = ["^tests/"]
