name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: backend-lint
      - run: uv sync
      - run: uv run flake8 .
      - run: uv run black --check .
      - run: uv run isort --check .

  backend-typecheck:
    name: Backend · type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: backend-typecheck
      - run: uv sync
      - run: uv run mypy .

  backend-test:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # MongoDB e MinIO come service container effimeri, non servizi esterni
    # remoti: un problema di rete/credenziali/disponibilità condiviso non
    # deve poter far fallire i test a codice perfetto. MongoDB standalone
    # (nessun replica set: nel codice non si usano transazioni). MinIO è
    # S3-compatibile (services/storage_service.py::get_s3 supporta già un
    # endpoint personalizzato, pensato per provider S3-compatibili non-AWS)
    # — serve ai test che caricano documenti (test_documents_iter6.py,
    # test_documents_upload.py).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minio-ci-user
          MINIO_ROOT_PASSWORD: minio-ci-password
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: salesfly_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: minio-ci-user
      AWS_SECRET_ACCESS_KEY: minio-ci-password
      AWS_S3_BUCKET: salesfly-ci-test
      S3_ENDPOINT: http://localhost:9000
      REACT_APP_BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: backend-test
      - run: uv sync
      - name: Crea il bucket S3 di test su MinIO
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://salesfly-ci-test
      - name: Avvia il backend in background
        run: |
          uv run uvicorn server:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "Il backend non ha risposto a /api/health entro 30s"
          exit 1
      # test_manifest/test_sw verificano che il frontend PWA (manifest.json/sw.js)
      # sia servito sulla stessa origin del backend — vero in produzione grazie al
      # proxy Netlify verso Railway, non replicabile in questo job che avvia solo
      # il backend nudo. Deselezionati solo qui, non modificati: restano validi
      # come smoke test contro l'ambiente reale.
      #
      # test_ai_chat/test_ai_suggestions chiamano davvero l'endpoint AI (non
      # mockato) con ANTHROPIC_API_KEY: qui è un placeholder (verificato con
      # una chiamata reale a /v1/models: HTTP 401), come PAYPAL_CLIENT_ID/
      # SECRET — deselezionati per lo stesso motivo delle 2 righe sopra.
      - run: >
          uv run pytest -q
          --deselect tests/test_p1_features.py::TestPwaAssets::test_manifest
          --deselect tests/test_p1_features.py::TestPwaAssets::test_sw
          --deselect tests/test_backend_api.py::TestAI::test_ai_chat
          --deselect tests/test_backend_api.py::TestAI::test_ai_suggestions
      # Il post-step di setup-uv (salvataggio/pruning cache) falliva con
      # "exit code 2" mentre il processo uvicorn avviato sopra era ancora
      # vivo — probabile conflitto sui file di .venv. if: always() perché
      # va fermato anche se pytest fallisce, non solo quando passa.
      - name: Ferma il backend
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

  frontend-lint:
    name: Frontend · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
